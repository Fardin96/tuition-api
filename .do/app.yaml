# DigitalOcean App Platform spec
# Apply with: doctl apps create --spec .do/app.yaml
# Or update:  doctl apps update <app-id> --spec .do/app.yaml
#
# NOTE: App Platform does NOT read this file on git push. Changes here only take
# effect when applied with doctl/the UI. Applying it replaces dashboard secrets
# with the <...> placeholders, so re-enter real values afterwards.
#
# This app uses an EXISTING DigitalOcean managed Postgres cluster and its
# connection pooler. Set the <...> secrets below via the App Platform UI or
# doctl before deploying.

name: tuition-api
region: blr

services:
  - name: api
    source_dir: /
    github:
      repo: fardin96/tuition-api
      branch: main
      deploy_on_push: true
    build_command: yarn install --frozen-lockfile --production=false && yarn db:generate && yarn build
    run_command: node dist/server.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    health_check:
      http_path: /api/v1/health
      port: 3000
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: HOST
        value: '0.0.0.0'
      # Frontend origin(s) for CORS (comma separated for multiple)
      - key: FRONTEND_URL
        value: <frontend-url>
      # Connection pooler URL for the running app (transaction pooling).
      # Replace with the pooler connection string from your DO dashboard.
      # connection_limit sets the app's pool size per container (read in src/lib/prisma.ts,
      # default 5); the DO pooler multiplexes these over its 22 backend connections.
      # Do NOT add pgbouncer=true; it has no effect with the pg driver adapter.
      - key: DATABASE_POOL_URL
        value: <paste-pool-url-here>?&pgbouncer=true&connection_limit=5
        type: SECRET
      # Direct DB URL (port 25060). Used only by the `migrate` PRE_DEPLOY job;
      # never run migrations through the pooler.
      - key: DATABASE_URL
        value: <paste-direct-db-url-here>
        type: SECRET
      # Contents of the DigitalOcean "Download CA certificate" file.
      - key: DATABASE_CA_CERT
        value: <database-ca-cert-pem-content>
        type: SECRET
      # Token secrets - generate with: openssl rand -base64 48
      - key: ACCESS_TOKEN_SECRET
        value: <access-token-secret>
        type: SECRET
      - key: REFRESH_TOKEN_SECRET
        value: <refresh-token-secret>
        type: SECRET
      # Google OAuth (frontend sends ID token; backend only verifies it)
      - key: GOOGLE_CLIENT_ID
        value: <google-client-id>
        type: SECRET
      # Super-admin allowlist (seeded once via yarn db:seed).
      # Set real values in the App Platform UI or via doctl before running the seed job.
      - key: SUPER_ADMIN_EMAIL_1
        value: <super-admin-email-1>
        type: SECRET
      - key: SUPER_ADMIN_EMAIL_2
        value: <super-admin-email-2>
        type: SECRET
      # Cloudflare R2 (S3-compatible) for file uploads
      # Endpoint format: https://<account-id>.r2.cloudflarestorage.com
      # Region for R2 is always: auto
      - key: R2_ENDPOINT
        value: <r2-endpoint>
      - key: R2_REGION
        value: auto
      - key: R2_BUCKET
        value: <r2-bucket>
      - key: R2_ACCESS_KEY_ID
        value: <r2-access-key-id>
        type: SECRET
      - key: R2_SECRET_ACCESS_KEY
        value: <r2-secret-access-key>
        type: SECRET
      - key: R2_PUBLIC_URL_PREFIX
        value: <r2-public-url-or-empty>
      # n8n webhook for WhatsApp notifications
      - key: N8N_WEBHOOK_URL
        value: <n8n-webhook-url>
      - key: N8N_WEBHOOK_SECRET
        value: <n8n-webhook-secret>
        type: SECRET

jobs:
  # Database migrations run as a PRE_DEPLOY job so a failed migration fails the
  # deploy without crashing the running service. This also keeps migration logs
  # separate from the app runtime and lets `scripts/migrate.sh` recover from
  # transient migration failures before `prisma migrate deploy` runs.
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: /
    github:
      repo: fardin96/tuition-api
      branch: main
      deploy_on_push: true
    build_command: yarn install --frozen-lockfile --production=false && yarn db:generate
    run_command: bash scripts/migrate.sh
    environment_slug: node-js
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      # Direct DB URL (port 25060). Never run migrations through the pooler.
      - key: DATABASE_URL
        value: <paste-direct-db-url-here>
        type: SECRET
      # Contents of the DigitalOcean "Download CA certificate" file.
      - key: DATABASE_CA_CERT
        value: <database-ca-cert-pem-content>
        type: SECRET

  # Soft warning at 21 days, hard expiry at 28 days. Runs weekly; that is
  # frequent enough for a 7-day expiry tolerance.
  - name: weekly-location-expiry
    kind: SCHEDULED
    source_dir: /
    github:
      repo: fardin96/tuition-api
      branch: main
      deploy_on_push: true
    build_command: yarn install --frozen-lockfile --production=false && yarn db:generate && yarn build
    run_command: node dist/cron/weekly-location-expiry.js
    environment_slug: node-js
    instance_size_slug: basic-xxs
    schedule:
      cron: "0 3 * * 0"
      time_zone: UTC
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: <paste-direct-db-url-here>
        type: SECRET
      - key: DATABASE_POOL_URL
        value: <paste-pool-url-here>?&pgbouncer=true&connection_limit=5
        type: SECRET
      - key: DATABASE_CA_CERT
        value: <database-ca-cert-pem-content>
        type: SECRET
