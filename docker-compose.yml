version: "3.8"

services:
  db:
    image: postgres:17-alpine
    container_name: tuition-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tuition_dev
    ports:
      - "5432:5432"
    volumes:
      - tuition_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tuition_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment when you add a background worker container
  # worker:
  #   build: .
  #   command: node dist/worker.js
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  tuition_pg_data:
