name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tuition
          POSTGRES_PASSWORD: tuition
          POSTGRES_DB: tuition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Type check
        run: yarn typecheck

      - name: Run tests
        env:
          DATABASE_URL: postgresql://tuition:tuition@localhost:5432/tuition_test
          TEST_DATABASE_URL: postgresql://tuition:tuition@localhost:5432/tuition_test
          ACCESS_TOKEN_SECRET: ci-access-token-secret-min-32-chars-12345
          REFRESH_TOKEN_SECRET: ci-refresh-token-secret-min-32-chars-67890
          GOOGLE_CLIENT_ID: ci-google-client-id
          SUPER_ADMIN_EMAIL_1: super1@example.com
          SUPER_ADMIN_EMAIL_2: super2@example.com
        run: yarn test:ci

      - name: Build
        run: yarn build
